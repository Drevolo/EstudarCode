<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstudarCode — Aprenda a programar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <h1 class="logo text-base sm:text-xl md:text-[1.4rem]">Estudar<span class="text-brand-green">Code</span></h1>
      <div class="topbar-right">
        <div class="stats" id="statsBar"></div>
        <div class="top-actions">
          <button id="themeBtn" class="reset-btn theme-btn" title="Alternar tema claro/escuro"><span class="theme-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/></svg></span><span class="theme-text">escuro</span></button>
          <button id="badgesBtn" class="app-btn" onclick="openBadges()" title="Ver suas conquistas"><span class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.166 2.621v.858c-1.035.148-2.059.33-3.071.543a.75.75 0 0 0-.584.859 6.753 6.753 0 0 0 6.138 5.6 6.73 6.73 0 0 0 2.743 1.346A6.707 6.707 0 0 1 9.279 15H8.54c-1.036 0-1.875.84-1.875 1.875V19.5h-.75a2.25 2.25 0 0 0-2.25 2.25c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-2.25-2.25h-.75v-2.625c0-1.036-.84-1.875-1.875-1.875h-.739a6.706 6.706 0 0 1-1.112-3.173 6.73 6.73 0 0 0 2.743-1.347 6.753 6.753 0 0 0 6.139-5.6.75.75 0 0 0-.585-.858 47.077 47.077 0 0 0-3.07-.543V2.62a.75.75 0 0 0-.658-.744 49.22 49.22 0 0 0-6.093-.377c-2.063 0-4.096.128-6.093.377a.75.75 0 0 0-.657.744Zm0 2.629c0 1.196.312 2.32.857 3.294A5.266 5.266 0 0 1 3.16 5.337a45.6 45.6 0 0 1 2.006-.343v.256Zm13.5 0v-.256c.674.1 1.343.214 2.006.343a5.265 5.265 0 0 1-2.863 3.207 6.72 6.72 0 0 0 .857-3.294Z" clip-rule="evenodd"/></svg></span>Conquistas</button>
          <button id="logoutBtn" class="reset-btn logout-btn" title="Sair da sua conta"><span class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 0 0 6 5.25v13.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V15a.75.75 0 0 1 1.5 0v3.75a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3V5.25a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3V9A.75.75 0 0 1 15 9V5.25a1.5 1.5 0 0 0-1.5-1.5h-6Zm10.72 4.72a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 1 1-1.06-1.06l1.72-1.72H9a.75.75 0 0 1 0-1.5h10.94l-1.72-1.72a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg></span>Sair</button>
        </div>
      </div>
    </div>
    <nav class="tabs-bar">
      <div class="course-tabs" id="courseTabs"></div>
    </nav>
  </header>

  <div class="layout" id="layout">
    <button id="sideTab" class="side-tab" title="Abrir lista de tópicos e progresso"><span class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 6.75A.75.75 0 0 1 3.75 6h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 6.75ZM3 12a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12Zm0 5.25a.75.75 0 0 1 .75-.75H12a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/></svg></span><span>Trilha</span></button>
    <div id="sideBackdrop" class="side-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="topic-scroll">
        <nav id="topicList"></nav>
      </div>
    </aside>

    <main class="content">
      <section id="contentArea"></section>
    </main>
  </div>

  <div id="overlayRoot"></div>

  <!-- ===== Tela de autenticação (login obrigatório) ===== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 class="logo auth-logo">Estudar<span>Code</span></h1>
      <p class="auth-tagline" id="authTagline">Verificando sua sessão…</p>

      <div id="authMsg" class="auth-msg" hidden></div>

      <!-- Formulário único: alterna entre Entrar / Criar conta -->
      <form id="authForm" autocomplete="on" onsubmit="event.preventDefault(); return false;">
        <label class="auth-label" for="authEmail">E-mail</label>
        <input class="auth-input" id="authEmail" type="email" required autocomplete="email" placeholder="voce@email.com" />

        <label class="auth-label" for="authPass">Senha</label>
        <input class="auth-input" id="authPass" type="password" required autocomplete="current-password" placeholder="Digite sua senha" />

        <button class="btn auth-submit" id="authSubmit" type="submit">Entrar</button>
      </form>

      <div class="auth-links">
        <button id="authToggle" class="auth-link" type="button">Não tem conta? <b>Criar conta</b></button>
        <button id="authForgot" class="auth-link" type="button">Esqueci minha senha</button>
      </div>

      <div id="authConfigError" class="auth-config-error" hidden>
        <p><b>Configuração pendente.</b></p>
        <p id="authConfigErrorText"></p>
        <p>Veja o arquivo <code>README-SUPABASE.md</code> para instruções.</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    Feito para estudar programação: Lógica, C, Python, JavaScript, HTML e CSS.
  </footer>

  <script src="js/supabase-config.js?v=2"></script>
  <script src="js/supabase-client.js?v=2"></script>
  <script src="js/data-py.js?v=2"></script>
  <script src="js/data-js.js?v=2"></script>
  <script src="js/data-html.js?v=2"></script>
  <script src="js/data-css.js?v=2"></script>
  <script src="js/icons.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/interpreter.js?v=2"></script>
</body>
</html>
