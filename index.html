<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstudarCode — Aprenda a programar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            brand: {
              green: "var(--green)",
              "green-dark": "var(--green-dark)",
              blue: "var(--accent-2)",
              red: "var(--red)",
              yellow: "var(--yellow)",
              purple: "var(--purple)",
              orange: "var(--orange)",
              cyan: "var(--cyan)"
            },
            surface: {
              DEFAULT: "var(--bg)",
              app: "var(--bg-app)",
              card: "var(--card)",
              "card-2": "var(--card-2)"
            },
            text: {
              DEFAULT: "var(--text)",
              muted: "var(--muted)"
            },
            edge: {
              DEFAULT: "var(--border)",
              strong: "var(--border-strong)"
            }
          },
          borderRadius: {
            DEFAULT: "var(--radius)",
            sm: "var(--radius-sm)"
          },
          boxShadow: {
            card: "var(--shadow)",
            lg: "var(--shadow-lg)"
          },
          fontFamily: {
            sans: ["Nunito", "Segoe UI", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <h1 class="logo text-base sm:text-xl md:text-[1.4rem]">Estudar<span class="text-brand-green">Code</span></h1>
      <div class="topbar-right">
        <div class="stats" id="statsBar"></div>
        <div class="top-actions">
          <button id="themeBtn" class="reset-btn theme-btn" title="Alternar tema claro/escuro">☾ escuro</button>
          <button id="debugBtn" class="app-btn" onclick="openDebuggerForCourse()" title="Testar código na linguagem do curso atual (C, Python, JavaScript ou HTML/CSS)">Executar código</button>
          <button id="badgesBtn" class="app-btn" onclick="openBadges()" title="Ver suas conquistas">Conquistas</button>
          <button id="logoutBtn" class="reset-btn logout-btn" title="Sair da sua conta">Sair</button>
          <button id="resetBtn" class="reset-btn" title="Zerar progresso e conquistas">Reiniciar</button>
        </div>
      </div>
    </div>
    <nav class="tabs-bar">
      <div class="course-tabs" id="courseTabs"></div>
    </nav>
  </header>

  <div class="layout" id="layout">
    <button id="sideTab" class="side-tab" title="Abrir lista de tópicos e progresso">&#9776;<span>Trilha</span></button>
    <div id="sideBackdrop" class="side-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="topic-scroll">
        <nav id="topicList"></nav>
      </div>
    </aside>

    <main class="content">
      <section id="contentArea"></section>
    </main>
  </div>

  <div id="overlayRoot"></div>

  <!-- ===== Tela de autenticação (login obrigatório) ===== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 class="logo auth-logo">Estudar<span>Code</span></h1>
      <p class="auth-tagline" id="authTagline">Verificando sua sessão…</p>

      <div id="authMsg" class="auth-msg" hidden></div>

      <!-- Formulário único: alterna entre Entrar / Criar conta -->
      <form id="authForm" autocomplete="on">
        <label class="auth-label" for="authEmail">E-mail</label>
        <input class="auth-input" id="authEmail" type="email" required autocomplete="email" placeholder="voce@email.com" />

        <label class="auth-label" for="authPass">Senha</label>
        <input class="auth-input" id="authPass" type="password" required autocomplete="current-password" placeholder="Digite sua senha" />

        <button class="btn auth-submit" id="authSubmit" type="submit">Entrar</button>
      </form>

      <div class="auth-links">
        <button id="authToggle" class="auth-link" type="button">Não tem conta? <b>Criar conta</b></button>
        <button id="authForgot" class="auth-link" type="button">Esqueci minha senha</button>
      </div>

      <div id="authConfigError" class="auth-config-error" hidden>
        <p><b>Configuração pendente.</b></p>
        <p id="authConfigErrorText"></p>
        <p>Veja o arquivo <code>README-SUPABASE.md</code> para instruções.</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    Feito para estudar programação: Lógica, C, Python, JavaScript, HTML e CSS.
  </footer>

  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="data-py.js"></script>
  <script src="data-js.js"></script>
  <script src="data-html.js"></script>
  <script src="data-css.js"></script>
  <script src="app.js"></script>
  <script src="interpreter.js"></script>
</body>
</html>
